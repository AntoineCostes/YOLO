; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = super_mini_esp32c3

[env:super_mini_esp32c3]
platform = espressif32
board = super_mini_esp32c3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = 
    -DNIMBLE_CPP_LOG_LEVEL=4
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
	-std=gnu++17
	-DBURN_EFUSE_DISABLE_UART0_BOOT_LOG
lib_deps = 
	h2zero/NimBLE-Arduino@^2.3.7
	bblanchon/ArduinoJson@^7.4.2
	madhephaestus/ESP32Servo@^3.0.6
	sparkfun/SparkFun STC3x Arduino Library@^1.0.0
	adafruit/Adafruit SHTC3 Library@^1.0.2
	sparkfun/SparkFun MS5637 Barometric Pressure Library@^1.0.2
	adafruit/Adafruit BusIO@^1.17.4
